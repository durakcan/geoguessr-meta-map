<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoGuessr Meta Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; height: 100vh; background: #1a1a1a; color: #fff; }
    #map { flex: 1; height: 100%; }
    
    /* Sidebar styling */
    #sidebar {
      width: 350px;
      background: #252525;
      padding: 20px;
      overflow-y: auto;
      border-left: 2px solid #333;
    }
    h2 { color: #4CAF50; margin-bottom: 10px; }
    .meta-group { margin-bottom: 15px; }
    .meta-label { font-weight: bold; color: #bbb; display: block; margin-bottom: 4px; }
    .meta-value { background: #333; padding: 8px; border-radius: 4px; font-size: 14px; }
  </style>
</head>
<body>

  <div id="map"></div>
  <div id="sidebar">
    <h2 id="country-name">Select a Country</h2>
    <p id="instruction">Click any country on the map to display its GeoGuessr metas.</p>
    
    <div id="meta-content" style="display: none;">
      <div class="meta-group">
        <span class="meta-label">Utility Poles / Wiring:</span>
        <div class="meta-value" id="meta-poles"></div>
      </div>
      <div class="meta-group">
        <span class="meta-label">Road Delineators / Bollards:</span>
        <div class="meta-value" id="meta-bollards"></div>
      </div>
      <div class="meta-group">
        <span class="meta-label">License Plates:</span>
        <div class="meta-value" id="meta-plates"></div>
      </div>
      <div class="meta-group">
        <span class="meta-label">Car Meta / Coverage:</span>
        <div class="meta-value" id="meta-car"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 1. Add your country meta database here (using 3-letter ISO codes or country names)
    const countryMeta = {
      "Brazil": {
        poles: "Ladder poles, X-shaped crossarms.",
        bollards: "Red back reflector, white front reflector.",
        plates: "Red commercial plates, Mercosur plates (white with blue stripe).",
        car: "Black antenna, Gen 3/4 camera."
      },
      "Japan": {
        poles: "Yellow/black warning bands at the base, double poles.",
        bollards: "Yellow pole delineators.",
        plates: "Yellow plates for Kei cars, white standard plates.",
        car: "Low camera height in cities."
      },
      "Ghana": {
        poles: "Wooden poles, often bare tops.",
        bollards: "Rare.",
        plates: "Yellow rear license plates.",
        car: "Black tape on the roof rack bars."
      }
    };

    // 2. Initialize Leaflet Map
    const map = L.map('map').setView([20, 0], 2);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; CartoDB'
    }).addTo(map);

    // 3. Fetch public GeoJSON for world boundaries
    fetch('https://raw.githubusercontent.com/johan/world-geojson/master/countries.geo.json')
      .then(response => response.json())
      .then(data => {
        L.geoJSON(data, {
          style: {
            fillColor: '#3388ff',
            weight: 1,
            opacity: 1,
            color: '#ffffff',
            fillOpacity: 0.2
          },
          onEachFeature: function (feature, layer) {
            layer.on({
              mouseover: (e) => {
                e.target.setStyle({ fillOpacity: 0.5 });
              },
              mouseout: (e) => {
                e.target.setStyle({ fillOpacity: 0.2 });
              },
              click: (e) => {
                const name = feature.properties.name;
                displayMeta(name);
              }
            });
          }
        }).addTo(map);
      });

    // 4. Update the sidebar when clicked
    function displayMeta(countryName) {
      document.getElementById('instruction').style.display = 'none';
      document.getElementById('meta-content').style.display = 'block';
      document.getElementById('country-name').innerText = countryName;

      const data = countryMeta[countryName] || {
        poles: "No data added yet.",
        bollards: "No data added yet.",
        plates: "No data added yet.",
        car: "No data added yet."
      };

      document.getElementById('meta-poles').innerText = data.poles;
      document.getElementById('meta-bollards').innerText = data.bollards;
      document.getElementById('meta-plates').innerText = data.plates;
      document.getElementById('meta-car').innerText = data.car;
    }
  </script>
</body>
</html>
